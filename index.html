// ルール本体。画面に依存しない。
const START_FUNDS=1000, HANDS_PER_TABLE=5, FINAL_TABLE=7;
const TARGETS=[1500,3000,6000,15000,40000,120000,400000,1500000];
const targetOf=t=>t<TARGETS.length?TARGETS[t]:TARGETS[TARGETS.length-1]*Math.pow(4,t-TARGETS.length+1);
const minBetOf=t=>Math.max(10,Math.round(targetOf(t)*0.02/10)*10);
const PRICE={rewrite:.2,gold:.15,throw:.5,bowl:.3};
const priceOf=(kind,t)=>Math.max(10,Math.round(targetOf(t)*PRICE[kind]/10)*10);
const newDice=()=>[0,1,2].map(()=>({faces:[1,2,3,4,5,6],gold:[0,0,0,0,0,0]}));
const ri=n=>Math.floor(Math.random()*n);
function rollDie(d){const i=ri(6);return {i,f:d.faces[i],gold:!!d.gold[i]}}
const rollAll=dice=>dice.map(rollDie);
function classify(v){
  const s=[...v].sort((a,b)=>a-b);
  if(s[0]===s[2])return {kind:'zoro',face:s[0],base:s[0]===1?5:3,name:s[0]===1?'ピンゾロ':s[0]+'のゾロ目'};
  if(s[0]===4&&s[1]===5&&s[2]===6)return {kind:'shigoro',base:2,name:'シゴロ'};
  if(s[0]===1&&s[1]===2&&s[2]===3)return {kind:'hifumi',base:2,name:'ヒフミ'};
  if(s[0]===s[1])return {kind:'eye',eye:s[2],name:'目 '+s[2]};
  if(s[1]===s[2])return {kind:'eye',eye:s[0],name:'目 '+s[0]};
  return {kind:'none',name:'目なし'};
}

};
const dealerInfo=id=>({id,faces:[1,2,3,4,5,6],throws:3,reroll:0,tie:false,inst:1,...DEALERS[id]});
function makeDealerOrder(){
  const ids=['one','drunk','six','twin','tekka','greedy','stubborn'].sort(()=>Math.random()-.5);
  return ['plain',...ids.slice(0,6),'boss'];
}
const dealerAt=(order,t)=>dealerInfo(t<order.length?order[t]:order[1+(t%6)]);
/* 親は役が出るまで振る。目が低いと振り直す親もいる */
function dealerRolls(dl){
  const rolls=[],pick=()=>dl.faces[ri(6)];
  for(let i=0;i<dl.throws;i++){
    const v=[pick(),pick(),pick()],c=classify(v);rolls.push({v,c});
    if(c.kind==='none')continue;
    if(c.kind==='eye'&&c.eye<=dl.reroll&&i<dl.throws-1)continue;
    break;
  }
  return rolls;
}
/* 早上がりの利息と闇金 */
const earlyLeaveBonus=(t,hand)=>(HANDS_PER_TABLE-hand)*Math.round(targetOf(t)*.05/10)*10;
const loanAmount=t=>Math.max(minBetOf(t)*5,Math.round(targetOf(t)*.5/10)*10);
const LOAN_RATE=2,DEBT_INTEREST=1.5;
/* 勝率: 目が親以下なら投げ直す前提の最善手 */
function standOutcome(eye,dealerEye,tie){return eye>dealerEye?{w:1,d:0,l:0}:(eye===dealerEye&&!tie)?{w:0,d:1,l:0}:{w:0,d:0,l:1}}

    else if(k.kind==='eye'){o=standOutcome(k.eye,dealerEye,tie);if(next&&(next.w-next.l)>(o.w-o.l))o=next}

const cubeGeom=W=>{const c=Math.round(W*.2),a=W-c,top=Math.round(a*.86),b=Math.round(W*.24);return {a,c,top,b,H:top+b}};

  for(let i=0,y=0;y<FONT.height;y++)for(let x=0;x<w;x++,i++){
    if(raw.charCodeAt(i>>3)&(1<<(7-(i&7))))g.fillRect(x,y,1,1);
  }
  glyphs.set(key,c);
  return c;
}
function drawText(ctx,t,x,y,color='wh',scale=1){
  x=Math.round(x);y=Math.round(y);
  for(const ch of String(t)){
    const c=glyphCanvas(ch,color);
    ctx.drawImage(c,x,y,c.width*scale,c.height*scale);

}
function wrapText(t,maxW){
  const out=[];let line='',w=0;

    const cw=charWidth(ch);

    line+=ch;w+=cw;
  }
  if(line)out.push(line);

}

/* game */
// ランの進行。描画に依存せず、画面へ渡す出来事の配列を返す。


function newRun(){
  const S={table:0,hand:0,funds:START_FUNDS,dice:newDice(),throwsMax:3,deep:false,order:makeDealerOrder(),
    debt:0,loanTable:-1,loanUsed:false,leftBonus:0,offers:[],picking:null,selected:0,justWon:false,won:false,
    phase:'ante',ante:0,anteVal:0,wager:0,fundsAtHand:0,stay:0,dealer:null,dealerRoll:null,dist:null,again:null,throwsLeft:0,
    cur:null,curRolls:null,cap:10,result:null,endReason:'',cleared:false,lastInfo:null,winAtBet:null,
    log:[],bestMult:0,bonusCount:0,peak:START_FUNDS};
  beginHand(S);
  return S;
}
const dl=S=>dealerAt(S.order,S.table);
const goal=(S,t=S.table)=>targetOf(t)+(S.debt&&t>S.loanTable?S.debt:0);
function beginHand(S){
  Object.assign(S,{phase:'ante',dealer:null,dealerRoll:null,dist:null,again:null,cur:null,curRolls:null,result:null,wager:0,ante:0,winAtBet:null});
  S.fundsAtHand=S.funds;S.stay=S.funds>=goal(S)?1:0;
  S.anteVal=anteOptions(S)[1].amount;
}
const up10=x=>Math.ceil(x/10)*10;
function anteOptions(S){
  const min=Math.min(S.funds,minBetOf(S.table)),clamp=a=>Math.min(S.funds,Math.max(min,a));
  return [
    {label:'最低',amount:min},
    {label:'1/4',amount:clamp(up10(S.funds/4))},
    {label:'1/3',amount:clamp(up10(S.funds/3))},
    {label:'1/2',amount:clamp(up10(S.funds/2))},
    {label:'全部',amount:S.funds}
  ];
}
function raiseOptions(S){
  const out=[];
  [[1,'そのまま'],[2,'2倍'],[3,'3倍']].forEach(([m,label])=>{
    const w=Math.min(S.ante*m,S.funds);
    if(out.some(o=>o.w===w))return;
    out.push({w,label:w>=S.funds?'全賭け':label,cap:capFor(w,S.fundsAtHand)});
  });
  return out;
}
function settle(S,net,text,kind,events){
  S.funds=Math.max(0,S.funds+net);
  S.peak=Math.max(S.peak,S.funds);
  const rate=Math.abs(net)/Math.max(1,S.wager);
  const formula=!net||kind==='fold'?'':(net<0&&!Number.isInteger(rate*2)?'払いは所持金までです':{wager:S.wager,rate});
  S.result={net,text,kind,formula};
  S.lastInfo={net,kind,pct:Math.round(S.wager/Math.max(1,S.fundsAtHand)*100),win:S.winAtBet};
  S.log.push({table:S.table,hand:S.hand,net,kind});
  S.phase='result';
  events.push({type:'settle',net,funds:S.funds,kind});
  return events;
}
function placeAnte(S,amount){
  const events=[];
  S.ante=Math.min(S.funds,Math.max(Math.min(S.funds,minBetOf(S.table)),amount));
  S.wager=S.ante;S.fundsAtHand=S.funds;
  const info=dl(S),rolls=dealerRolls(info);
  for(const r of rolls)events.push({type:'dealerThrow',v:r.v,c:r.c});
  const c=rolls[rolls.length-1].c;
  S.dealerRoll=rolls[rolls.length-1].v;
  if(c.kind==='zoro'||c.kind==='shigoro'){
    S.dealer=c;
    const m=c.base*info.inst;
    return settle(S,-Math.min(S.funds,S.ante*m),`親の${c.name}。賭け金の${m}倍を払います。`,'dealerRole',events);
  }
  if(c.kind==='hifumi'){
    S.dealer=c;
    const m=2*info.inst;
    return settle(S,S.ante*m,`親のヒフミ。賭け金の${m}倍をもらいます。`,'dealerRole',events);
  }
  S.dealer=c.kind==='none'?{kind:'eye',eye:0,name:'目なし'}:c;
  S.dist=winDist(S.dice,S.throwsMax,S.dealer.eye,info.tie);
  S.phase='raise';
  return events;
}
function raise(S,w){
  S.wager=w;S.cap=capFor(w,S.fundsAtHand);S.throwsLeft=S.throwsMax;S.cur=null;S.winAtBet=S.dist.w;
  return throwDice(S);
}
function fold(S){
  return settle(S,-Math.min(S.funds,Math.ceil(S.ante/2)),`親の${S.dealer.name}を見て降りました。`,'fold',[]);
}
/* 大盤振る舞いの結果を先に決め、画面は1投ずつ再生する */
function runBonus(S,c,extra){
  const b=bonusStart(c.face,c.base+extra,S.cap),start=b.M,steps=[];
  while(!b.done&&b.M<b.cap){
    const r=bonusThrow(b,S.dice,S.deep);
    steps.push({rolls:r.rolls,raw:r.raw,hits:r.hits,M:b.M,n:b.n});
  }
  S.bestMult=Math.max(S.bestMult,b.M);S.bonusCount++;
  return {type:'bonus',face:c.face,name:c.name,start,cap:S.cap,steps,M:b.M,why:b.why||'cap'};
}
function throwDice(S){
  const events=[],rolls=rollAll(S.dice),c=classify(rolls.map(r=>r.f)),info=dl(S);
  S.throwsLeft--;S.cur=c;S.curRolls=rolls;
  events.push({type:'playerThrow',rolls,c});
  const extra=rolls.filter(r=>r.gold).length+S.stay;
  if(c.kind==='zoro'){
    const ev=runBonus(S,c,extra);
    events.push(ev);
    return settle(S,S.wager*ev.M,`${c.name}から大盤振る舞い。`,'bonus',events);
  }
  if(c.kind==='shigoro')return settle(S,S.wager*(2+extra),'シゴロで勝ちました。','win',events);
  if(c.kind==='hifumi')return settle(S,-Math.min(S.funds,S.wager*2),'ヒフミ。賭け金の2倍を払います。','lose',events);
  if(c.kind==='eye'){
    if(S.throwsLeft>0){
      S.again=winDist(S.dice,S.throwsLeft,S.dealer.eye,info.tie);
      S.phase='decide';
      return events;
    }
    return resolveEye(S,events);
  }
  if(S.throwsLeft>0){
    S.again=winDist(S.dice,S.throwsLeft,S.dealer.eye,info.tie);
    S.phase='throw';
    return events;
  }
  if(S.dealer.eye===0&&!info.tie)return settle(S,0,'双方とも目なしで引き分けです。','draw',events);
  return settle(S,-Math.min(S.funds,S.wager),'目なしのまま振り切りました。','lose',events);
}
function resolveEye(S,events){
  const c=S.cur,d=S.dealer,info=dl(S),extra=S.curRolls.filter(r=>r.gold).length+S.stay,o=standOutcome(c.eye,d.eye,info.tie);
  if(o.w)return settle(S,S.wager*(1+extra),`${c.name}で親の${d.name}に勝ちました。`,'win',events);
  if(o.d)return settle(S,0,`${c.name}で親と同じ。引き分けです。`,'draw',events);
  return settle(S,-Math.min(S.funds,S.wager),`${c.name}で親の${d.name}に負けました。`,'lose',events);
}
const stand=S=>resolveEye(S,[]);
function nextHand(S){
  if(S.funds<=0)return lose(S,'破産しました');
  S.hand++;
  if(S.hand>=HANDS_PER_TABLE)return S.funds>=goal(S)?enterShop(S):lose(S,'ノルマに届きませんでした');
  if(S.funds<minBetOf(S.table))return S.funds>=goal(S)?enterShop(S):lose(S,'最低の賭け金に届きません');
  beginHand(S);
  return [];
}
function leaveEarly(S){
  const b=earlyLeaveBonus(S.table,S.hand);
  S.funds+=b;S.peak=Math.max(S.peak,S.funds);S.leftBonus=b;
  return enterShop(S);
}
function lose(S,reason){
  S.cleared=false;S.endReason=reason;S.phase='end';
  return [{type:'end'}];
}
function enterShop(S){
  S.cleared=true;
  if(S.debt&&S.table>S.loanTable)S.debt=Math.floor(S.debt*DEBT_INTEREST/10)*10;
  S.justWon=S.table===FINAL_TABLE&&!S.won;
  if(S.justWon)S.won=true;
  S.offers=makeOffers(S.deep,S.throwsMax);S.picking=null;S.selected=0;S.phase='shop';
  return [{type:'shop'}];
}
const offerPrice=(S,o)=>priceOf(o.kind,S.table);
/* 面を選ぶ品は picking に入り、選んだ時に支払う */
function buyOffer(S,i){
  const o=S.offers[i],p=offerPrice(S,o);
  if(!o||o.sold||S.funds<p)return false;
  if(o.kind==='rewrite'||o.kind==='gold'){S.picking={...o,i,price:p};return true}
  S.funds-=p;o.sold=true;
  if(o.kind==='throw')S.throwsMax++;
  if(o.kind==='bowl')S.deep=true;
  return true;
}
function pickFace(S,di,fi){
  const k=S.picking;if(!k)return false;
  const d=S.dice[di];
  if(k.kind==='rewrite'){if(d.faces[fi]===k.num)return false;d.faces[fi]=k.num}
  else{if(d.gold[fi])return false;d.gold[fi]=1}
  S.funds-=k.price;S.offers[k.i].sold=true;S.picking=null;
  return true;
}
const canLoan=S=>!S.loanUsed&&S.table+1<FINAL_TABLE;
function takeLoan(S){
  if(!canLoan(S))return false;
  const L=loanAmount(S.table+1);
  S.funds+=L;S.debt=L*LOAN_RATE;S.loanTable=S.table+1;S.loanUsed=true;S.peak=Math.max(S.peak,S.funds);
  return true;
}
function repay(S){
  if(!S.debt||S.funds<S.debt)return false;
  S.funds-=S.debt;S.debt=0;
  return true;
}
function leaveShop(S){
  S.table++;S.hand=0;S.leftBonus=0;S.justWon=false;S.picking=null;
  if(S.funds<minBetOf(S.table))return lose(S,'最低の賭け金に届きません');
  beginHand(S);
  return [];
}

}

  let rest=100-f.reduce((a,b)=>a+b,0);
  v.map((x,i)=>[x-f[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rest>0){f[i]++;rest--}});

}

function diePositions(n){
  const cx=BOWL.cx,cy=BOWL.cy+3,pts=[];
  if(n<=3){
    const base=[[-30,-11],[28,-8],[-1,12]];
    for(let i=0;i<n;i++)pts.push([cx+base[i][0]+rnd(7)-3,cy+base[i][1]+rnd(5)-2]);

  const rx=n<=12?48:61,ry=n<=12?22:27,off=Math.random()*6.28;

function countFunds(to){
  const from=V.funds;
  if(REDUCED||from===to||window.__fast){V.funds=to;return Promise.resolve()}
  return new Promise(res=>{
    const t0=performance.now(),dur=Math.min(1000,300+Math.abs(Math.log10((to+1)/(from+1)))*260);
    (function step(now){
      const k=Math.min(1,(now-t0)/dur);
      V.funds=k>=1?to:Math.exp(Math.log(from+1)+(Math.log(to+1)-Math.log(from+1))*(1-Math.pow(1-k,3)))-1;
      if(k<1)requestAnimationFrame(step);else res();
    })(t0);
  });
}

/* 今やることの文章。18字×2行まで */
function panel(){
  const s=S.phase;
  if(V.busy)return {lines:[V.msg]};
  if(s==='ante'){
    const v=S.anteVal,allin=v>=S.funds;
    const tail=allin?'全賭け。倍率の上限なし':v*3>=S.funds?'親を見て全賭けまで可':`親を見て${yen(Math.min(v*3,S.funds))}まで増額可`;
    const head=S.stay?`居座り中 勝つと+1倍 ${yen(v)}`:`賭け金 ${yen(v)}`;
    return {lines:[head,tail]};
  }
  if(s==='raise'){
    const d=S.dealer,tie=dl(S).tie;
    const cond=d.eye===0?'親は目なし。目が出れば勝ち':d.eye===6?'親は目6。役が要ります':`親は目${d.eye}。目${d.eye+1}以上で勝ち`;
    return {lines:[cond+(tie?'':'')],odds:S.dist};
  }
  if(s==='throw')return {lines:[S.cur?`役なし。あと${S.throwsLeft}回振れます`:'賽を振ってください'],odds:S.again};
  if(s==='decide'){
    const o=standOutcome(S.cur.eye,S.dealer.eye,dl(S).tie);
    const now=o.w?'今なら勝ち':o.d?'今なら引き分け':'今なら負け';
    return {lines:[`${S.cur.name}。${now}。振り直すと`],odds:S.again};
  }
  if(s==='result'){
    const r=S.result;
    const f=r.formula&&typeof r.formula==='object'?`${yen(r.formula.wager)} ${mul(r.formula.rate)}`:(r.formula||'');
    return {lines:[...wrapText(r.text,W-12).slice(0,1),f||wrapText(r.text,W-12)[1]||'']};
  }
  return {lines:['']};
}
function say(){
  const p=panel();
  const q=p.odds?pct3(p.odds):null;
  const t=p.lines.filter(Boolean).join(' ')+(q?` 勝ち${q[0]}% 分け${q[1]}% 負け${q[2]}%`:'');
  if(live.textContent!==t)live.textContent=t;
}

    const t=L.kind==='dealerRole'?`最後は所持金の${L.pct}%を賭けた所へ親の役が来ました。`:L.win!=null?`最後は勝率${pct(L.win)}の場面で所持金の${L.pct}%を賭けました。`:'';
    for(const l of wrapText(t,W-16)){drawText(ctx,l,8,y,'wh1');y+=12}
  }
  y+=6;
  const best=Math.max(loadBest(),S.peak);
  const rows=[['到達した卓',String(S.table+1)],['最高所持金',yen(S.peak)],['大盤振る舞い',S.bonusCount+'回'],['最高倍率',S.bestMult?mul(S.bestMult):'なし'],['自己ベスト',yen(best)]];
  rows.forEach(([k,v])=>{drawText(ctx,k,8,y,'wh2');drawText(ctx,v,W-8-textWidth(v),y,'wh');y+=14});
}
function drawShop(){
  fill(0,47,W,H-47,'ink1');
  const next=dealerAt(S.order,S.table+1);
  const head=S.justWon?'借金完済。ここから延長戦':`卓${S.table+1}を突破`+(S.leftBonus?` 利息+${yen(S.leftBonus)}`:'');
  fill(0,37,W,10,'ink0');
  drawText(ctx,head,3,37,'kin2');
  drawText(ctx,'次の親 '+next.name,3,48,'wh');
  next.faces.forEach((f,i)=>img(spr(`S${f}normalfalse`,()=>flatDie(f,'normal',false)),W-68+i*11,49));
  wrapText(next.desc,W-6).slice(0,2).forEach((l,i)=>drawText(ctx,l,3,59+i*11,'wh1'));
  const n=goal(S,S.table+1),m=S.debt&&S.table+1>S.loanTable?'借金込み':`最低${yen(minBetOf(S.table+1))}`;
  drawText(ctx,`次のノルマ ${yen(n)}`,3,81,'wh');
  drawText(ctx,m,W-3-textWidth(m),81,S.debt&&S.table+1>S.loanTable?'shu1':'wh2');
  if(S.picking){
    const pk=S.picking;
    drawText(ctx,pk.kind==='rewrite'?`${pk.num}に書き換える面を選択`:'金箔を貼る面を選択',3,92,'kin2');
    const names=['壱','弐','参'];
    names.forEach((t,i)=>drawText(ctx,t,1,112+i*30,'wh'));
    return;
  }
  const o=S.offers[S.selected],y=103+27*3+2,bottom=H-4-92;
  let desc=OFFER_TEXT(o)[1],col='wh1';
  if(V.loanAsk){
    const L=loanAmount(S.table+1);
    desc=`今${yen(L)}受け取り、次の次の卓からノルマ+${yen(L*LOAN_RATE)}。以後1卓ごとに1.5倍。店で全額返せば消えます。`;col='kin2';
  }else if(S.debt&&S.table+1<=S.loanTable)desc=`借金${yen(S.debt)}は次の次の卓から加算。`+desc;
  fill(1,y,W-2,Math.max(10,bottom-y-2),'ink0');
  wrapText(desc,W-8).slice(0,Math.floor((bottom-y-2)/11)).forEach((l,i)=>drawText(ctx,l,4,y+1+i*11,col));
}
function drawHelp(){
  fill(0,0,W,H,'ink0');
  drawText(ctx,'役と払い',4,3,'kin1',2);
  const rows=[['ピンゾロ',[1,1,1],'×5'],['ゾロ目',[4,4,4],'×3'],['シゴロ',[4,5,6],'×2'],['目',[2,2,5],'×1'],['目なし',[1,3,6],'-1'],['ヒフミ',[1,2,3],'-2']];
  rows.forEach(([n,d,m],i)=>{
    const y=28+i*14;
    drawText(ctx,n,4,y,'wh');
    d.forEach((f,k)=>img(spr(`S${f}normalfalse`,()=>flatDie(f,'normal',false)),74+k*11,y));
    drawText(ctx,m,W-6-textWidth(m),y,m[0]==='×'?'kin2':'shu1');
  });
  const info=dl(S),z=zoroChance(S.dice);
  const notes=['目は揃わない1個が点数。親より大きければ勝ち。','ゾロ目で大盤振る舞い。倍率上限は賭け金が所持金の25%未満で×10、25%以上×30、50%以上×100、全賭けで上限なし。','増額は最初の賭け金の3倍まで。','ノルマ達成後、居座ると払い+1倍。早上がりは利息。'];
  let y=114;
  for(const t of notes){for(const l of wrapText(t,W-8)){drawText(ctx,l,4,y,'wh1');y+=11}y+=2}
  for(const l of wrapText(`今の親 ${info.name}:${info.desc}`,W-8).slice(0,3)){drawText(ctx,l,4,y,'kin2');y+=11}
  y+=2;
  S.dice.forEach((d,di)=>{d.faces.forEach((f,fi)=>img(spr(`S${f}normal${!!d.gold[fi]}`,()=>flatDie(f,'normal',!!d.gold[fi])),4+fi*11,y));y+=10});
  drawText(ctx,`ゾロ目率${(z*100).toFixed(1)}%`,76,y-20,'wh');
  drawText(ctx,`振る回数${S.throwsMax}回`,76,y-10,'wh');
  drawText(ctx,'どこかを押すと閉じます',4,H-14,'wh2');
}
function frame(now){
  ctx.imageSmoothingEnabled=false;
  fill(0,0,W,H,'ink0');
  if(S.phase==='end'){
    drawHUD();drawEnd();
  }else if(S.phase==='shop'){
    drawHUD();drawShop();
  }else{
    const shaking=now<V.shakeUntil;
    if(shaking){const a=V.shakeAmp;ctx.save();ctx.translate(rnd(a*2+1)-a,rnd(a*2+1)-a)}
    drawStage(now);
    if(shaking)ctx.restore();
    drawHUD();
    drawPanel();
    if(V.bonus&&!V.bonus.done){
      // 木札は沈めて、押せないことを形で伝える
      for(let i=0;i<4;i++)img(spr('sunk',()=>tagSprite(42,44,'off')),3+i*44,H-22);
      drawText(ctx,'長押しで早送り',4,H-11,'wh2');
    }
    if(V.bonus)drawBonusHead(now);
  }
  buttons=V.help?[]:controls();
  buttons.forEach(drawTag);
  drawCoins();
  if(V.bonus&&!V.bonus.done)drawBorder(now);
  fill(W-73,1,16,11,'ai');drawText(ctx,'役',W-70,1,'wh');
  drawText(ctx,muted?'音切':'音入',W-52,1,muted?'gr1':'wh2');
  if(V.help)drawHelp();
  if(window.__benchOn)window.__benchTick(now);
  requestAnimationFrame(frame);
}

/* 整数倍で拡大。端末の実ピクセルで計算する */
function resize(){
  const dpr=window.devicePixelRatio||1,box=document.getElementById('stage');
  const sw=box.clientWidth*dpr,sh=box.clientHeight*dpr;
  scale=Math.max(1,Math.floor(Math.min(sw/W,sh/MIN_H)));
  H=Math.max(MIN_H,Math.min(MAX_H,Math.floor(sh/scale)));
  E=H-MIN_H;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  cv.style.width=(W*scale/dpr)+'px';
  cv.style.height=(H*scale/dpr)+'px';
}
addEventListener('resize',resize);

/* 音 */
let muted=false;
const sfx={ctx:null,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  noise(t,dur,vol,freq){if(!this.ctx||muted)return;const c=this.ctx,len=Math.max(1,c.sampleRate*dur|0),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=3;const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+t)},
  tone(t,freq,dur,vol,type='square'){if(!this.ctx||muted)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;const at=c.currentTime+t;g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0008,at+dur);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+dur)},
  rattle(n){const k=Math.min(10,3+n);for(let i=0;i<k;i++)this.noise(i*.032,.03,.22,2600+Math.random()*2400)},
  clack(n){const k=Math.min(7,n);for(let i=0;i<k;i++)this.noise(i*.022,.05,.42,1700+Math.random()*1300)},
  tap(){this.tone(0,880,.04,.05)},
  hit(i){this.tone(0,330*Math.pow(1.06,Math.min(36,i*2)),.14,.08)},
  stop(){this.tone(0,110,.5,.1,'triangle')},
  win(l){[523,659,784,1047,1319].slice(0,l+2).forEach((f,i)=>this.tone(i*.07,f,.2,.07))},
  bad(){this.tone(0,180,.3,.1,'sawtooth');this.tone(.1,120,.35,.09,'sawtooth')},
  jackpot(){[392,523,659,784,1047,1319,1568].forEach((f,i)=>this.tone(i*.07,f,.26,.08))}
};

/* 検証用。48個の負荷測定と、画面の状態確認に使う */
window.__S=S;
window.__V=V;
window.__buttons=()=>buttons;
window.__scale=()=>({scale,H,E});
window.__play=play;
window.__burst=burst;
window.__throwN=n=>{
  const items=[];for(let i=0;i<n;i++)items.push({die:S.dice[i%3],top:rnd(6)});
  return throwAnim(items);
};
window.__bench=(n,ms)=>new Promise(res=>{
  let frames=0,last=performance.now(),worst=0,sum=0,count=0,t0=last;
  V.busy=true;
  const respawn=()=>{const items=[];for(let i=0;i<n;i++)items.push({die:S.dice[i%3],top:rnd(6)});throwAnim(items)};
  respawn();const iv=setInterval(respawn,500);
  window.__benchOn=true;
  window.__benchTick=now=>{
    const dt=now-last;last=now;frames++;if(frames>3){worst=Math.max(worst,dt);sum+=dt;count++}
    if(now-t0>ms){window.__benchOn=false;clearInterval(iv);V.busy=false;V.dice=[];res({avg:sum/count,worst,frames:count})}
  };
});
resize();say();requestAnimationFrame(frame);

</script>
